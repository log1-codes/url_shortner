services:
  postgres:
    image: postgres:16-alpine
    container_name: url_shortner_db
    restart: unless-stopped
    ports:
     - "5432:5432"
    environment:
      POSTGRES_USER: urlshortner
      POSTGRES_PASSWORD: urlshortner
      POSTGRES_DB: urlshortner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U urlshortner -d urlshortner"]
      interval: 5s
      timeout: 5s 
      retries: 5 
  
volumes:
  postgres_data: