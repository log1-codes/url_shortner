services:

  postgres:
    image: postgres:16-alpine

    container_name: url_shortner_dev_db

    restart: unless-stopped

    environment:
      POSTGRES_USER: urlshortner
      POSTGRES_PASSWORD: urlshortner
      POSTGRES_DB: urlshortner

    ports:
      - "5432:5432"

    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U urlshortner -d urlshortner"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ../..
      dockerfile: docker/dev/backend.Dockerfile

    container_name: url_shortner_dev_backend

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: postgres://urlshortner:urlshortner@postgres:5432/urlshortner?sslmode=disable
      JWT_SECRET: dev-only-change-me-32-byte-secret

    volumes:
      - ../..:/app
      - go_modules:/go/pkg/mod

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ../..
      dockerfile: docker/dev/frontend.Dockerfile

    container_name: url_shortner_dev_frontend

    restart: unless-stopped

    ports:
      - "5173:5173"

    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

    volumes:
      - ../../web:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend


volumes:
  postgres_dev_data:
  go_modules:
  frontend_node_modules:
